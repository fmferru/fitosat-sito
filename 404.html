<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina non trovata – Fitosat</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>
  @font-face { font-family: "Josefin Sans"; font-weight: 700; font-display: swap; src: url("/fonts/josefin-700.woff2") format("woff2"); }
@font-face { font-family: "Questrial"; font-weight: 400; font-display: swap; src: url("/fonts/questrial-400.woff2") format("woff2"); }
  :root { --bg:#f4ebe6; --ink:#24161d; --muted:#5a434c; --brand:#66284a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1416; --ink:#f1e7e9; --muted:#d4c3c9; --brand:#e0b4c8; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem 1rem;
    background:var(--bg); color:var(--ink); font-family:"Questrial","Avenir Next","Segoe UI",sans-serif; }
  .code { font-family:"Josefin Sans",sans-serif; font-weight:700; font-size:clamp(4rem,18vw,8rem); line-height:1; color:var(--brand); letter-spacing:.04em; }
  h1 { font-family:"Josefin Sans",sans-serif; font-weight:700; font-size:1.5rem; margin:1rem 0 .5rem; }
  p { color:var(--muted); margin:0 0 2rem; }
  a.btn { display:inline-block; font-family:"Josefin Sans",sans-serif; font-weight:700; color:#fff; text-decoration:none; padding:.9rem 1.5rem .75rem;
    background:linear-gradient(135deg,#3f7d30,#2a6121); border-radius:3px 22px 3px 22px; }
  .en { margin-top:2.5rem; font-size:.9rem; color:var(--muted); }
  .en a { color:var(--brand); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Questa pagina non esiste</h1>
  <p>Il link potrebbe essere vecchio o scritto male.</p>
  <a class="btn" href="/">Torna a Fitosat</a>
  <p class="en">Page not found. <a href="/en/">Go to the English site</a></p>
</main>
</body>
</html>
